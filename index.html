<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navu: Treasures of the Fallen — Online</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/dialogs.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Top bar: horizontal phase tracker + Log / Turn Actions buttons.
             Replaces the old vertical action rail and always-visible log panel,
             so the board/dock/side-panel below get the freed-up space. -->
        <div id="top-bar">
            <div id="phase-tracker-h"></div>
            <div id="top-bar-actions">
                <button id="btn-open-log" class="top-bar-btn" onclick="window.gameUI.toggleLogPopup()">📜 Log</button>
                <button id="btn-open-turn-actions" class="top-bar-btn" onclick="window.gameUI.toggleTurnActionsPopup()">▶ Turn Actions</button>
            </div>
        </div>

        <!-- Top Board Area -->
        <div id="board-area">
            <div id="player-dock">
                <h2>Player Dock</h2>
                <div id="player-dock-container">
                    <!-- Specific player setup goes here -->
                </div>
            </div>

            <div id="locations-area">
                <!-- Location hotspots -->
                <div class="location" id="loc-favors"></div>
                <div class="location" id="loc-barracks"></div>
                <div class="location" id="loc-archery"></div>
                <div class="location" id="loc-docks"></div>
                <div class="location" id="loc-assassins"></div>
                <div class="location" id="loc-raidOrders"></div>
                <div class="location" id="loc-commandCenter"></div>
                <div class="location" id="loc-contractHall"></div>
                <div class="location" id="loc-influence"></div>
                <div class="location" id="loc-blacksmith"></div>
                <div class="location" id="loc-armory"></div>
                <!-- Influence & Strength track disc overlays (cover the full board;
                     children are positioned with percentages relative to it, same as
                     .location/.hex-segment/.commander). pointer-events:none so they
                     never block clicks on the board underneath. -->
                <div id="influence-track" style="position:absolute; inset:0; z-index:22; pointer-events:none;">
                </div>
                <div id="strength-track" style="position:absolute; inset:0; z-index:22; pointer-events:none;">
                </div>
            </div>

            <div id="cards-market-area">
                <div id="gear-market">
                    <h2>Gear Market</h2>
                    <div class="cards-container" id="gear-container"></div>
                </div>
                <div id="raids-market">
                    <h2>Available Raids</h2>
                    <div class="cards-container" id="raids-container"></div>
                </div>
                <div id="leaders-market">
                    <h2>Available Leaders</h2>
                    <div class="cards-container" id="leaders-container"></div>
                </div>
            </div>

            <!-- Card preview panel (lives in board-area flex row) -->
            <div id="side-panel">
                <div id="card-preview"></div>
                <div id="board-zoom-container">
                    <div id="board-zoom-content">
                        <img id="board-zoom-image" src="assets/images/board/FINAL_NAVU_BOARD.png" alt="Zoomed Board">
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Player Dashboards Area -->
        <div id="players-area">
            <!-- Dynamically populated per player -->
        </div>
    </div>

    <!-- Load scripts in dependency order: data -> core -> ai -> ui -> main -->
    <script src="js/data/cards.js"></script>
    <script src="js/data/gameState.js"></script>
    <script src="js/data/personalities.js"></script>
    <script src="js/ui/dialogs.js"></script>
    <script src="js/core/choiceResolver.js"></script>
    <script src="js/core/engine.js"></script>
    <script src="js/ai/aiEngine.js"></script>
    <script src="js/ai/turnController.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
