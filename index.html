<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navu: Treasures of the Fallen — Online</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/board.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="css/dialogs.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <!-- Top Board Area -->
        <div id="board-area">
            <div id="player-dock">
                <h2>Player Dock</h2>
                <div id="player-dock-container">
                    <!-- Specific player setup goes here -->
                </div>
            </div>

            <div id="locations-area">
                <!-- Location hotspots -->
                <div class="location" id="loc-favors"></div>
                <div class="location" id="loc-barracks"></div>
                <div class="location" id="loc-archery"></div>
                <div class="location" id="loc-docks"></div>
                <div class="location" id="loc-assassins"></div>
                <div class="location" id="loc-raidOrders"></div>
                <div class="location" id="loc-commandCenter"></div>
                <div class="location" id="loc-contractHall"></div>
                <div class="location" id="loc-influence"></div>
                <div class="location" id="loc-blacksmith"></div>
                <div class="location" id="loc-armory"></div>
                <!-- Influence track - lower left of board -->
                <div id="influence-track" style="position:absolute; bottom:5%; left:2%; width:39%; height:10%;
                            display:flex; align-items:center; gap:4px; z-index:20; padding:2px;">
                </div>
                <!-- Strength track - lower right of board -->
                <div id="strength-track" style="position:absolute; bottom:5%; right:2%; width:30%; height:10%;
                            display:flex; align-items:center; gap:4px; z-index:20; padding:2px;">
                </div>
            </div>

            <div id="cards-market-area">
                <div id="gear-market">
                    <h2>Gear Market</h2>
                    <div class="cards-container" id="gear-container"></div>
                </div>
                <div id="raids-market">
                    <h2>Available Raids</h2>
                    <div class="cards-container" id="raids-container"></div>
                </div>
                <div id="leaders-market">
                    <h2>Available Leaders</h2>
                    <div class="cards-container" id="leaders-container"></div>
                </div>
            </div>

            <!-- Card preview panel (lives in board-area flex row) -->
            <div id="side-panel">
                <div id="card-preview"></div>
                <div id="board-zoom-container">
                    <div id="board-zoom-content">
                        <img id="board-zoom-image" src="assets/images/board/FINAL_NAVU_BOARD.png" alt="Zoomed Board">
                    </div>
                </div>
            </div>

            <!-- Vertical Action Area -->
            <div id="action-area">
                <div id="phase-tracker"></div>
                <h1 id="phase-title">Game Setup</h1>
                <p id="phase-instruction">Select the number of players to begin.</p>
                <div id="action-controls">
                    <div class="setup-group">
                        <h3>Player Options</h3>
                        <button id="btn-start" onclick="window.gameEngine.startGame(2)">Start 2 Player (Human)</button>
                        <button id="btn-start-3" onclick="window.gameEngine.startGame(3)">Start 3 Player (Human)</button>
                    </div>
                    <div class="setup-group setup-group-ai">
                        <h3>Single Player Mode</h3>
                        <div class="setup-ai-select-row">
                            <label for="ai-count">AI Opponents:</label>
                            <select id="ai-count">
                                <option value="1">1 AI</option>
                                <option value="2">2 AIs</option>
                                <option value="3">3 AIs</option>
                                <option value="4">4 AIs</option>
                            </select>
                        </div>
                        <button id="btn-start-ai" class="btn-start-ai"
                            onclick="const count = parseInt(document.getElementById('ai-count').value); window.gameEngine.startGame(1, count)">Start
                            Single Player</button>
                    </div>
                </div>
            </div>

            <!-- Moved Game Log -->
            <div id="game-log-container">
                <h3>Game Log</h3>
                <div id="game-log"></div>
            </div>
        </div>

        <!-- Bottom Player Dashboards Area -->
        <div id="players-area">
            <!-- Dynamically populated per player -->
        </div>
    </div>

    <!-- Load scripts in dependency order: data -> core -> ai -> ui -> main -->
    <script src="js/data/cards.js"></script>
    <script src="js/data/gameState.js"></script>
    <script src="js/data/personalities.js"></script>
    <script src="js/ui/dialogs.js"></script>
    <script src="js/core/choiceResolver.js"></script>
    <script src="js/core/engine.js"></script>
    <script src="js/ai/aiEngine.js"></script>
    <script src="js/ai/turnController.js"></script>
    <script src="js/ui/ui.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
